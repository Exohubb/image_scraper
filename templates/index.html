{% extends 'base.html' %}

{% block head %}
<title>Image Scraper - Search</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block body %}
<div class="content">
    <h1>🖼️ Image Scraper</h1>
    <p>Search any keyword to scrape and save images directly to local storage.</p>

    <div class="form">
        <form action="/review" method="POST">
            <input type="text" name="content" id="content" placeholder="e.g. cars, nature, galaxy..." required>
            <input type="submit" value="Scrape & Save Images">
        </form>
    </div>
</div>
{% endblock %}
